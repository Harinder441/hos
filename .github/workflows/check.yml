name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # run it on a branch before landing: gh workflow run check.yml --ref <branch>

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.repository.private && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}  # macOS only on the public repo: private-repo macOS minutes cost 10x
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/site/package-lock.json
      - name: tmux and a git with config hooks (the macOS runner has neither)
        if: runner.os == 'macOS'
        run: brew install tmux git && git --version && tmux -V
      - name: diag (temporary)
        if: runner.os == 'macOS'
        run: |
          which -a git; git --version; echo "TMPDIR=$TMPDIR"; env | grep -i '^GIT' || true
          git config --system -l --show-origin || true
          d=$(mktemp -d) && git init -q "$d" && printf '[hook "identity-guard"]\n\tevent = pre-commit\n\tcommand = /usr/bin/true\n' > "$d/gc"
          (cd "$d" && GIT_CONFIG_GLOBAL="$d/gc" git hook list pre-commit; echo "exit $?")
          (cd "$d" && GIT_CONFIG_GLOBAL="$d/gc" /usr/bin/git --version; GIT_CONFIG_GLOBAL="$d/gc" /usr/bin/git hook list pre-commit; echo "apple exit $?")
          (cd "$d" && GIT_CONFIG_GLOBAL="$d/gc" GIT_TRACE=1 git hook list pre-commit 2>&1 | tail -5)
      - run: git config --global user.name ci && git config --global user.email ci@hos.local && git config --global init.defaultBranch main
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint (hover text on every control, generated recipe pages up to date)
        run: node scripts/check-hover-text.mjs && node docs/site/scripts/gen-recipes.mjs --check
      - name: Unit tests
        run: npx vitest run --exclude '**/*.live.test.ts'
      - name: Docs build
        if: matrix.os == 'ubuntu-latest'
        run: npm --prefix docs/site ci && npm --prefix docs/site run build
