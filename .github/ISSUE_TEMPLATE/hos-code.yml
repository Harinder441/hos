name: Bug in hos-code (Code view)
description: Something in Code view, or hos-code run on its own, does not work.
labels: ["bug", "hos-code"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: hos-code version
      description: The output of `hos-code -version`, and `hos --version` if you opened it from hos.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and browser
      description: For example macOS 15 with Chrome 131.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Terminal output or browser console errors. Remove tokens and paths you would rather keep private.
      render: text
